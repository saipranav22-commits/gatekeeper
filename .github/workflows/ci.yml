name: Gatekeeper CI Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gatekeeper_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Start Redis with Password Authentication
        env:
          CI_REDIS_PASSWORD: test_redis_password
        run: |
          # Cleanup any lingering container from previous or aborted runs
          docker rm -f redis-ci 2>/dev/null || true

          # Start Redis 7 with password authentication
          docker run -d \
            --name redis-ci \
            -p 6379:6379 \
            redis:7-alpine \
            redis-server --requirepass "$CI_REDIS_PASSWORD"

          # Await Redis readiness with authenticated ping
          REDIS_READY=false
          for i in {1..30}; do
            if docker run --rm --network host redis:7-alpine redis-cli -a "$CI_REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
              echo "Redis is ready with authenticated access."
              REDIS_READY=true
              break
            fi
            sleep 1
          done

          if [ "$REDIS_READY" != "true" ]; then
            echo "ERROR: Redis failed to reach ready state within 30 seconds."
            docker logs redis-ci 2>&1 || true
            exit 1
          fi

          # Verify that unauthenticated access is strictly rejected (NOAUTH)
          if docker run --rm --network host redis:7-alpine redis-cli ping 2>&1 | grep -q "NOAUTH"; then
            echo "Verified: Unauthenticated requests are rejected with NOAUTH."
          else
            echo "ERROR: Redis failed to reject unauthenticated request."
            exit 1
          fi

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Full Backend Test Suite
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gatekeeper_test
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: test_redis_password
          GATEKEEPER_JWT_SECRET: "ci-test-secret-at-least-32-characters-entropy-required!"
        run: |
          mvn clean test \
            -f backend/pom.xml \
            -B \
            -DDB_HOST=$DB_HOST \
            -DDB_PORT=$DB_PORT \
            -DDB_NAME=$DB_NAME \
            -DDB_USERNAME=$DB_USERNAME \
            -DDB_PASSWORD=$DB_PASSWORD \
            -DREDIS_HOST=$REDIS_HOST \
            -DREDIS_PORT=$REDIS_PORT \
            -DREDIS_PASSWORD=$REDIS_PASSWORD \
            -DGATEKEEPER_JWT_SECRET="$GATEKEEPER_JWT_SECRET"

      - name: Verify Backend Packaging
        run: mvn package -f backend/pom.xml -DskipTests -B

      - name: Archive Backend Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

      - name: Teardown Redis Container
        if: always()
        run: |
          docker rm -f redis-ci 2>/dev/null || true

  microservices-test:
    name: Upstream Microservices Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test & Package Orders Microservice
        run: |
          mvn clean test -f services/orders-service/pom.xml -B
          mvn package -f services/orders-service/pom.xml -DskipTests -B

      - name: Test & Package Inventory Microservice
        run: |
          mvn clean test -f services/inventory-service/pom.xml -B
          mvn package -f services/inventory-service/pom.xml -DskipTests -B

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 (Active LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npx tsc -b

      - name: Run Linter
        run: npm run lint

      - name: Execute Vitest Suite
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

  security-gate:
    name: Production Profile & Chaos Lockout Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (Full History for Secret Audit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Production & Default Chaos Lockout Security Tests
        run: |
          mvn test \
            -f backend/pom.xml \
            -Dtest="ChaosProductionSecurityTest,ChaosDefaultProfileSecurityTest,ChaosSafetyGuardTest" \
            -B

      - name: Verify No Hardcoded Passwords in Production Config
        run: |
          if grep -iE "password:\s+['\"]?[a-zA-Z0-9_-]+['\"]?\s*$" backend/src/main/resources/application-prod.yml; then
            echo "ERROR: Hardcoded password detected in application-prod.yml"
            exit 1
          fi

      - name: Verify No Tracked Sensitive Files
        run: |
          if git ls-files | grep -E "\.env$|\.key$|\.pem$"; then
            echo "ERROR: Sensitive key or environment file tracked in git"
            exit 1
          fi

  docker-validation:
    name: Container Configuration & Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, microservices-test, frontend-test, security-gate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Deployment Docker Compose Specification
        env:
          POSTGRES_PASSWORD: ci_mock_postgres_password
          REDIS_PASSWORD: ci_mock_redis_password
          GATEKEEPER_JWT_SECRET: ci_mock_jwt_secret_must_be_at_least_32_bytes_entropy
        run: |
          docker compose -f docker-compose.deploy.yml config

      - name: Validate Container Builds
        env:
          POSTGRES_PASSWORD: ci_mock_postgres_password
          REDIS_PASSWORD: ci_mock_redis_password
          GATEKEEPER_JWT_SECRET: ci_mock_jwt_secret_must_be_at_least_32_bytes_entropy
        run: |
          docker compose -f docker-compose.deploy.yml build

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate ARM64 Dockerfile Syntax & Manifest Resolution
        run: |
          docker buildx build --platform linux/arm64 --check -f backend/Dockerfile backend
          docker buildx build --platform linux/arm64 --check -f services/orders-service/Dockerfile services/orders-service
          docker buildx build --platform linux/arm64 --check -f services/inventory-service/Dockerfile services/inventory-service
          docker buildx build --platform linux/arm64 --check -f frontend/Dockerfile frontend
