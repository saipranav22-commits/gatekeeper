name: Gatekeeper CI Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gatekeeper_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Start Redis with Password Authentication
        run: |
          docker run -d \
            --name redis \
            -p 6379:6379 \
            redis:7-alpine \
            redis-server --requirepass test_redis_password

          # Await Redis readiness
          for i in {1..30}; do
            if docker run --rm --network host redis:7-alpine redis-cli -a test_redis_password ping | grep -q PONG; then
              echo "Redis is ready with password authentication"
              break
            fi
            sleep 1
          done

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Full Backend Test Suite
        run: |
          mvn clean test \
            -f backend/pom.xml \
            -B \
            -DDB_HOST=localhost \
            -DDB_PORT=5432 \
            -DDB_NAME=gatekeeper_test \
            -DDB_USERNAME=test_user \
            -DDB_PASSWORD=test_password \
            -DREDIS_HOST=localhost \
            -DREDIS_PORT=6379 \
            -DREDIS_PASSWORD=test_redis_password \
            -DGATEKEEPER_JWT_SECRET="ci-test-secret-at-least-32-characters-entropy-required!"

      - name: Verify Backend Packaging
        run: mvn package -f backend/pom.xml -DskipTests -B

  microservices-test:
    name: Upstream Microservices Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test & Package Orders Microservice
        run: |
          mvn clean test -f services/orders-service/pom.xml -B
          mvn package -f services/orders-service/pom.xml -DskipTests -B

      - name: Test & Package Inventory Microservice
        run: |
          mvn clean test -f services/inventory-service/pom.xml -B
          mvn package -f services/inventory-service/pom.xml -DskipTests -B

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Execute Vitest Suite
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

  security-gate:
    name: Production Profile & Chaos Lockout Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Production & Default Chaos Lockout Security Tests
        run: |
          mvn test \
            -f backend/pom.xml \
            -Dtest="ChaosProductionSecurityTest,ChaosDefaultProfileSecurityTest,ChaosSafetyGuardTest" \
            -B

      - name: Verify No Hardcoded Passwords in Production Config
        run: |
          if grep -iE "password:\s+['\"]?[a-zA-Z0-9_-]+['\"]?\s*$" backend/src/main/resources/application-prod.yml; then
            echo "ERROR: Hardcoded password detected in application-prod.yml"
            exit 1
          fi

      - name: Verify No Tracked Sensitive Files
        run: |
          if git ls-files | grep -E "\.env$|\.key$|\.pem$"; then
            echo "ERROR: Sensitive key or environment file tracked in git"
            exit 1
          fi

  docker-validation:
    name: Container Configuration & Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, microservices-test, frontend-test, security-gate]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Deployment Docker Compose Specification
        env:
          POSTGRES_PASSWORD: ci_mock_postgres_password
          REDIS_PASSWORD: ci_mock_redis_password
          GATEKEEPER_JWT_SECRET: ci_mock_jwt_secret_must_be_at_least_32_bytes_entropy
        run: |
          docker compose -f docker-compose.deploy.yml config

      - name: Validate Container Builds
        env:
          POSTGRES_PASSWORD: ci_mock_postgres_password
          REDIS_PASSWORD: ci_mock_redis_password
          GATEKEEPER_JWT_SECRET: ci_mock_jwt_secret_must_be_at_least_32_bytes_entropy
        run: |
          docker compose -f docker-compose.deploy.yml build
