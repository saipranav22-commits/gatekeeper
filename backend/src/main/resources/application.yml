server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gatekeeper

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Gatekeeper Security Configuration
gatekeeper:
  security:
    jwt:
      secret-key: ${GATEKEEPER_JWT_SECRET:}
      issuer: ${GATEKEEPER_JWT_ISSUER:gatekeeper-auth}
      access-token-expiration-seconds: ${GATEKEEPER_JWT_EXPIRATION_SECONDS:900}
    login:
      max-attempts: ${GATEKEEPER_LOGIN_MAX_ATTEMPTS:5}
      lockout-duration-seconds: ${GATEKEEPER_LOGIN_LOCKOUT_SECONDS:900}
      fail-closed-on-outage: true

# OpenAPI 3 Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha


