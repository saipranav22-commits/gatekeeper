# ==============================================================================
# Gatekeeper Local Development Profile (local)
# ==============================================================================
# Configures connection to Gatekeeper PostgreSQL and Redis running on host ports
# mapped by Docker Compose (PostgreSQL 5434, Redis 6380).
# ==============================================================================

spring:
  # PostgreSQL Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5434}/${DB_NAME:gatekeeper}}
    username: ${DB_USERNAME:gatekeeper_app}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: GatekeeperHikariCP
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000

  # Spring Data JPA Configuration (Schema validated against Flyway)
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}

logging:
  level:
    com.gatekeeper: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN

gatekeeper:
  security:
    jwt:
      secret-key: ${GATEKEEPER_JWT_SECRET:}

