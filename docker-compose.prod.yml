name: gatekeeper-prod

services:
  postgres:
    image: postgres:16.8-alpine
    container_name: gatekeeper-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatekeeper}
      POSTGRES_USER: ${POSTGRES_USER:-gatekeeper_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
    volumes:
      - gatekeeper_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gatekeeper_app} -d ${POSTGRES_DB:-gatekeeper}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - gatekeeper-prod-net

  redis:
    image: redis:7.4-alpine
    container_name: gatekeeper-prod-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis password must be set}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy noeviction
      --dir /data
    volumes:
      - gatekeeper_prod_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - gatekeeper-prod-net

  orders:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile
    container_name: gatekeeper-prod-orders
    restart: unless-stopped
    environment:
      ORDERS_PORT: 8081
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health | grep -q \"UP\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 192M
    networks:
      - gatekeeper-prod-net

  inventory:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: gatekeeper-prod-inventory
    restart: unless-stopped
    environment:
      INVENTORY_PORT: 8082
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health | grep -q \"UP\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 192M
    networks:
      - gatekeeper-prod-net

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gatekeeper-prod-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-gatekeeper}
      DB_USERNAME: ${POSTGRES_USER:-gatekeeper_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis password must be set}
      GATEKEEPER_JWT_SECRET: ${GATEKEEPER_JWT_SECRET:?JWT secret must be set}
      GATEKEEPER_JWT_ISSUER: ${GATEKEEPER_JWT_ISSUER:-gatekeeper-auth}
      GATEKEEPER_JWT_EXPIRATION_SECONDS: ${GATEKEEPER_JWT_EXPIRATION_SECONDS:-900}
      GATEKEEPER_CORS_ALLOWED_ORIGINS: ${GATEKEEPER_CORS_ALLOWED_ORIGINS:-https://gatekeeper-ayh.pages.dev,http://localhost:3000,http://localhost:5173}
      ORDERS_UPSTREAM_URI: http://orders:8081
      INVENTORY_UPSTREAM_URI: http://inventory:8082
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orders:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health | grep -q \"UP\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - gatekeeper-prod-net

  # Optional zero-inbound-port Cloudflare Tunnel ingress
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gatekeeper-prod-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles:
      - tunnel
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - gatekeeper-prod-net

volumes:
  gatekeeper_prod_pgdata:
    name: gatekeeper_prod_pgdata
  gatekeeper_prod_redisdata:
    name: gatekeeper_prod_redisdata

networks:
  gatekeeper-prod-net:
    name: gatekeeper-prod-network
    driver: bridge
